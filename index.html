<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAIQ DONAT</title>

<style>

:root{
--primary:#FF671F;
--secondary:#6E3C18;
--cream:#FFF8F1;
--gold:#D7A441;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:var(--cream);
color:#333;
}


/* HERO */

.hero{

height:100vh;

background:
linear-gradient(rgba(0,0,0,.55),
rgba(0,0,0,.55)),
url('images/hero.jpg');

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;

text-align:center;
color:white;

padding:20px;

}

.hero-logo{

width:180px;
margin-bottom:25px;

}

.hero-content h1{

font-size:60px;
margin-bottom:10px;

}

.hero-content p{

font-size:24px;
margin-bottom:30px;

}


.btn{

padding:16px 40px;

background:var(--primary);

border-radius:50px;

text-decoration:none;

font-weight:bold;

color:white;

display:inline-block;

transition:0.3s;

}

.btn:hover{

background:#e95b17;

}


/* SECTION */

.section{

padding:80px 5%;

}


.section-title{

text-align:center;
margin-bottom:50px;

}


.section-title h2{

font-size:40px;

color:var(--secondary);

}



/* GALERI */

.gallery{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:25px;

}


.gallery img{

width:100%;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,0.1);

transition:0.3s;

}


.gallery img:hover{

transform:translateY(-5px);

}



/* HALAL */

.halal{

text-align:center;

padding:60px 20px;

}


.halal img{

width:120px;

margin-bottom:20px;

}


.halal p{

font-size:18px;

font-weight:600;

color:var(--secondary);

}



/* FOOTER */

footer{

background:var(--secondary);

color:white;

padding:30px;

text-align:center;

margin-top:50px;

}



/* RESPONSIVE */

@media(max-width:768px){

.hero-content h1{

font-size:40px;

}

.hero-content p{

font-size:18px;

}

.hero-logo{

width:130px;

}

}

</style>

</head>

<body>



<!-- HERO -->

<section class="hero">

<div class="hero-content">

<img src="images/logo.png"
class="hero-logo">

<h1>MAIQ DONAT</h1>

<p>
Donat Premium Homemade Bekasi
</p>

<a href="https://wa.me/6285215667159"
class="btn">

Pesan Sekarang

</a>

</div>

</section>




<!-- GALERI -->

<section id="galeri"
class="section">


<div class="section-title">

<h2>Galeri Produk</h2>

</div>


<div class="gallery">

<img src="images/donat1.jpg">

<img src="images/donat2.jpg">

<img src="images/donat3.jpg">

<img src="images/donat4.jpg">

<img src="images/donat5.jpg">

<img src="images/donat6.jpg">

</div>


</section>



<!-- HALAL -->

<section class="halal">

<img src="images/halal.png">

<p>

Produk MAIQ DONAT telah memiliki
Sertifikat Halal Indonesia.

</p>

</section>



<footer>

© 2026 MAIQ DONAT • Homemade Premium Bekasi

</footer>



</body>

</html>
